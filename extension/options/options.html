<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <header><img src="../icons/mail.svg" width="54" height="54" alt="">
    <div><p class="eyebrow">THUNDERBIRD · LINUX</p><h1 data-i18n="extensionName"></h1></div></header>
  <p class="intro" data-i18n="optionsIntro"></p>

  <section class="status-panel" aria-labelledby="status-title">
    <span id="status-dot" class="dot" aria-hidden="true"></span>
    <div><h2 id="status-title" data-i18n="statusConnecting"></h2><p id="status-detail" data-i18n="statusChecking"></p></div>
    <span id="unread" class="count" data-i18n-title="unreadMessages">—</span>
  </section>
  <p id="diagnostics" class="warning" hidden></p>

  <form id="settings" data-i18n-aria-label="settingsLabel">
    <section class="card">
      <label class="setting master"><span><strong data-i18n="settingEnabled"></strong><small data-i18n="settingEnabledDescription"></small></span>
        <input type="checkbox" name="enabled" role="switch"></label>
      <div id="dependent-settings">
        <label class="setting"><span><strong data-i18n="settingClose"></strong><small data-i18n="settingCloseDescription"></small></span>
          <input type="checkbox" name="closeToTray" role="switch"></label>
        <label class="setting"><span><strong data-i18n="settingMinimize"></strong><small data-i18n="settingMinimizeDescription"></small></span>
          <input type="checkbox" name="minimizeToTray" role="switch"></label>
        <label class="setting"><span><strong data-i18n="settingUnread"></strong><small data-i18n="settingUnreadDescription"></small></span>
          <input type="checkbox" name="showUnread" role="switch"></label>
        <label class="setting"><span><strong data-i18n="settingNotifications"></strong><small data-i18n="settingNotificationsDescription"></small></span>
          <input type="checkbox" name="notifications" role="switch"></label>
      </div>
    </section>
    <p id="save-status" class="save-status" role="status" aria-live="polite" data-i18n="settingsAutoSave"></p>
  </form>

  <section class="actions" data-i18n-aria-label="actionsLabel">
    <button id="hide" class="primary" disabled data-i18n="actionHide"></button>
    <button id="restore" data-i18n="actionRestore"></button>
    <button id="testNotification" disabled data-i18n="actionTestNotification"></button>
    <button id="retry" data-i18n="actionRetry"></button>
  </section>
  <p id="action-status" role="status" aria-live="polite"></p>

  <section class="help">
    <h2 data-i18n="helpTitle"></h2>
    <p data-i18n="helpRestore"></p>
    <p data-i18n="helpQuit"></p>
    <details><summary data-i18n="helpSetupTitle"></summary>
      <p><span data-i18n="helpSetup"></span><br>
        <a href="https://extensions.gnome.org/extension/615/appindicator-support/" target="_blank" rel="noreferrer" data-i18n="appIndicatorLink"></a></p>
      <p data-i18n="helpRecovery"></p>
      <p data-i18n="helpWayland"></p>
      <p data-i18n="helpNotifications"></p>
      <p data-i18n="helpUnread"></p>
    </details>
  </section>
  <footer data-i18n="privacyFooter"></footer>
</main>
<script type="module" src="options.mjs"></script>
</body>
</html>
