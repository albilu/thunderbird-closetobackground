name: Release

# Publishes the Debian package and the runtime tarball for a version tag
# (v0.1.5 -> 0.1.5, which must match extension/manifest.json).
# Build timestamps come from packaging/release.json — update its date (and
# debian_revision for repackages) together with the version bump.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match extension/manifest.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-gdkpixbuf-2.0

      - name: Run tests
        run: npm test

      - name: Build and verify checksums
        run: |
          python3 scripts/build.py
          cd "dist/$VERSION"
          sha256sum -c SHA256SUMS
          # Keep digests for exactly the two published runtime artifacts
          grep -E "_all\.deb$|-linux\.tar\.gz$" SHA256SUMS > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          python3 - <<'PY' > "$notes"
          import pathlib, re
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(r"^## .*?\n(.*?)(?:\n## |\Z)", changelog, re.S | re.M)
          print(match.group(1).strip() if match else "See CHANGELOG.md")
          PY
          gh release create "$GITHUB_REF_NAME" \
            --title "thunderbird-closetobackground $VERSION" \
            --notes-file "$notes" || true
          revision="$(python3 -c 'import json; print(json.load(open("packaging/release.json"))["debian_revision"])')"
          pool="dist/$VERSION"
          deb="$pool/thunderbird-closetobackground_${VERSION}-${revision}_all.deb"
          tarball="$pool/thunderbird-closetobackground-${VERSION}-linux.tar.gz"
          sums="$pool/SHA256SUMS"
          ls -l "$deb" "$tarball" "$sums"
          gh release upload "$GITHUB_REF_NAME" "$deb" "$tarball" "$sums" --clobber
